name: CD Pipeline

on:
  push:
    branches: [master]

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NODE_ENV: production
      CONTENT_BASE_URL: ${{ secrets.CONTENT_BASE_URL }}

    environment:
      name: Production
      url: https://portfolio.francomarino.dev

    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Extract pnpm version
        id: pnpm-version
        run: |
          PNPM_VERSION=$(jq -r .packageManager package.json | cut -d'@' -f2)
          echo "version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Extract node version
        id: node-version
        run: |
          NODE_VERSION=$(jq -r .engines.node package.json | cut -d'@' -f2)
          echo "version=$NODE_VERSION" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: Run unit tests
        run: pnpm run test:coverage

      - name: Build Astro
        run: pnpm run build

      - name: Deploy to Vercel
        run: pnpx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --yes

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
